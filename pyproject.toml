[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwl-mcp"
description = "GWL /api/v1 用户 API 的 MCP 服务（官方 Python SDK；stdio + Streamable HTTP）"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # 官方 MCP Python SDK：协议、传输、会话、SSE、CORS/Host 校验都由它负责
  "mcp>=2.3.0,<3",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
]

[project.scripts]
gwl-mcp = "gwl_mcp.cli:main"

[tool.setuptools]
packages = ["gwl_mcp", "gwl_mcp.tools"]

[tool.setuptools.dynamic]
version = { attr = "gwl_mcp.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
